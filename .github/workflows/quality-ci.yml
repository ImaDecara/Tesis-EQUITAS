name: Calidad - CI y gates

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      verify_failure:
        description: 'Ensayo controlado: una prueba frontend debe fallar y conservar reportes'
        required: false
        default: false
        type: boolean
      verify_gate_failure:
        description: 'Ensayo controlado: inyectar diagnostico critico en reporte y bloquear gate'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: quality-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  SUPABASE_TEST_ENABLED: 'false'

jobs:
  frontend:
    name: Frontend - pruebas, build y analisis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: back/.python-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Fijar npm
        run: npm install --global npm@11.21.1 --ignore-scripts --no-audit --no-fund
      - name: Instalar y ejecutar controles frontend
        env:
          CI_FAILURE_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_failure && 'true' || 'false' }}
        run: python quality/ci.py run frontend --install --output .quality/ci/frontend
      - name: Conservar reportes frontend aun con fallos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-frontend-${{ github.run_id }}-${{ github.run_attempt }}
          path: .quality/ci/frontend/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  backend:
    name: Backend - pruebas, cobertura y Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: back/.python-version
          cache: pip
          cache-dependency-path: |
            back/requirements.txt
            back/requirements-dev.txt
            back/constraints.txt
      - name: Instalar en entorno nuevo y ejecutar controles backend
        run: python quality/ci.py run backend --install --output .quality/ci/backend
      - name: Conservar reportes backend aun con fallos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: .quality/ci/backend/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  ci-summary:
    name: Quality gates y resumen
    needs: [frontend, backend]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: back/.python-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: .quality/download
      - name: Ensayo manual de bloqueo por critico en reporte
        if: github.event_name == 'workflow_dispatch' && inputs.verify_gate_failure
        env:
          CI_GATE_PROBE: critical
        run: python quality/gate_probe.py --artifacts .quality/download --output .quality/ci/summary
      - name: Crear resumen y propagar el estado real
        if: always()
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: python quality/ci.py summary --artifacts .quality/download --output .quality/ci/summary
      - name: Conservar resumen aun con fallos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: .quality/ci/summary/
          if-no-files-found: error
          retention-days: 30
